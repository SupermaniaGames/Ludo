<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Supermania Ludo</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14286b">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--navy:#14286b;--y:#ffc21a;--r:#e8322b;--b:#1e8be8;--g:#2fb83a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:#fff;color:var(--navy);min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 8px)}
[hidden]{display:none!important}
section{width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center;gap:12px}
#logo{width:min(78vw,340px)}
button{font:inherit;font-weight:800;border:0;border-radius:16px;padding:14px 18px;color:#fff;cursor:pointer;box-shadow:0 4px 0 #0003}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #0003}
button:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.big{width:100%;font-size:1.25rem}
.seg{display:flex;gap:8px;align-items:center;font-weight:800}
.seg button{background:#e9edf8;color:var(--navy);padding:10px 18px}
.seg button.on{background:var(--navy);color:#fff}
.credit{text-align:center;font-size:.85rem;line-height:1.5;margin-top:8px}
.credit b{color:#c98d00}
#bar{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px}
#back{background:var(--navy);padding:10px 14px}
#status{font-weight:800;display:flex;align-items:center;gap:8px;font-size:1.1rem}
#status i{width:18px;height:18px;border-radius:50%;border:2px solid var(--navy)}
#board{position:relative;width:min(100%,calc(100dvh - 250px),480px);aspect-ratio:1;border:4px solid var(--navy);border-radius:10px;background:#fff}
.lb{display:grid;grid-template:repeat(15,1fr)/repeat(15,1fr)}
.lb i{border:.5px solid #14286b33;font-style:normal;font-size:min(3vw,13px);display:grid;place-items:center;color:#14286b88}
.sb{display:grid;grid-template:repeat(10,1fr)/repeat(10,1fr)}
.sb i{font-style:normal;font-size:min(2.8vw,12px);font-weight:700;padding:2px;border:.5px solid #14286b22}
.sb svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tok{position:absolute;width:6.2%;aspect-ratio:1;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 4px #0006;transform:translate(-50%,-50%);transition:left .25s,top .25s;padding:0}
.sb .tok{width:5%}
.tok.go{animation:p .6s infinite alternate;z-index:5}
@keyframes p{to{transform:translate(-50%,-50%) scale(1.35)}}
@media (prefers-reduced-motion:reduce){.tok.go{animation:none;outline:3px solid var(--navy)}}
#dice{background:var(--y);color:var(--navy);font-size:3.2rem;line-height:1;padding:6px 22px}
#dice:disabled{opacity:.55}
</style></head><body>
<section id="menu">
 <img id="logo" src="logo.png" alt="Supermania Ludo">
 <div class="seg">Players
  <button data-n="2" class="on">2</button><button data-n="3">3</button><button data-n="4">4</button></div>
 <button class="big" id="bLudo" style="background:var(--g)">Play Ludo</button>
 <button class="big" id="bSnl" style="background:var(--b)">Play Snakes &amp; Ladders</button>
 <p class="credit">Made by <b>Supermania Games</b><br>Presented by <b>Boring Games</b></p>
</section>
<section id="play" hidden>
 <div id="bar"><button id="back">Menu</button><div id="status"></div></div>
 <div id="board"></div>
 <button id="dice" disabled aria-label="Roll the dice">⚀</button>
 <p class="credit">Made by <b>Supermania Games</b> · Presented by <b>Boring Games</b></p>
</section>
<script>
const $=s=>document.querySelector(s),F='⚀⚁⚂⚃⚄⚅';
const C=['#e8322b','#2fb83a','#ffc21a','#1e8be8'],N=['Red','Green','Yellow','Blue'];
let np=2,g=null;
const players=()=>({2:[0,2],3:[0,1,2],4:[0,1,2,3]}[np]);
document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{np=+b.dataset.n;document.querySelectorAll('[data-n]').forEach(x=>x.classList.toggle('on',x==b))});
const show=id=>['menu','play'].forEach(s=>$('#'+s).hidden=s!=id);
$('#back').onclick=()=>{g=null;show('menu')};
$('#bLudo').onclick=()=>{show('play');ludo()};
$('#bSnl').onclick=()=>{show('play');snl()};
$('#dice').onclick=()=>{if(g&&g.st=='roll'){g.st='busy';$('#dice').disabled=true;rollAnim(g.k=='ludo'?lRoll:sRoll)}};
function rollAnim(cb){let n=0;const iv=setInterval(()=>{$('#dice').textContent=F[Math.random()*6|0];if(++n>7){clearInterval(iv);const r=1+Math.random()*6|0;$('#dice').textContent=F[r-1];cb(r)}},60)}
function status(t,p){$('#status').innerHTML=(p>=0?`<i style="background:${C[p]}"></i>`:'')+t}
function ready(){g.st='roll';$('#dice').disabled=false;const p=g.P[g.turn];status(N[p]+"'s turn: roll",p)}

/* ---------- LUDO ---------- */
const PATH=[[6,1],[6,2],[6,3],[6,4],[6,5],[5,6],[4,6],[3,6],[2,6],[1,6],[0,6],[0,7],[0,8],[1,8],[2,8],[3,8],[4,8],[5,8],[6,9],[6,10],[6,11],[6,12],[6,13],[6,14],[7,14],[8,14],[8,13],[8,12],[8,11],[8,10],[8,9],[9,8],[10,8],[11,8],[12,8],[13,8],[14,8],[14,7],[14,6],[13,6],[12,6],[11,6],[10,6],[9,6],[8,5],[8,4],[8,3],[8,2],[8,1],[8,0],[7,0],[6,0]];
const START=[0,13,26,39],SAFE=[0,8,13,21,26,34,39,47];
const HC=[[1,2,3,4,5].map(i=>[7,i]),[1,2,3,4,5].map(i=>[i,7]),[13,12,11,10,9].map(i=>[7,i]),[13,12,11,10,9].map(i=>[i,7])];
const FIN=[[7,6],[6,7],[7,8],[8,7]],Y0=[[0,0],[0,9],[9,9],[9,0]];
function ludo(){
 const P=players();
 g={k:'ludo',P,t:P.map(()=>[-1,-1,-1,-1]),turn:0,roll:0,st:'roll'};
 const b=$('#board');b.className='lb';b.innerHTML='';
 const pi=new Map(PATH.map((p,i)=>[p+'',i]));
 for(let r=0;r<15;r++)for(let c=0;c<15;c++){
  const d=document.createElement('i');let bg='transparent';
  const yi=Y0.findIndex(([a,z])=>r>=a&&r<a+6&&c>=z&&c<z+6);
  if(yi>=0){const a=Y0[yi];bg=(r>a[0]&&r<a[0]+5&&c>a[1]&&c<a[1]+5)?`color-mix(in srgb,${C[yi]} 35%,#fff)`:C[yi]}
  else if(r>=6&&r<=8&&c>=6&&c<=8)bg='#14286b';
  else if(pi.has(r+','+c)){const ix=pi.get(r+','+c),s=START.indexOf(ix);bg=s>=0?C[s]:'#fff';if(s<0&&SAFE.includes(ix))d.textContent='★'}
  else{const h=HC.findIndex(a=>a.some(([x,y])=>x==r&&y==c));if(h>=0)bg=C[h]}
  d.style.background=bg;b.append(d);
 }
 g.el=P.map((p,k)=>[0,1,2,3].map(i=>{const e=document.createElement('button');e.className='tok';e.style.background=C[p];e.setAttribute('aria-label',N[p]+' token '+(i+1));e.onclick=()=>{if(g.st=='move'&&k==g.turn&&e.classList.contains('go'))lMove(i)};b.append(e);return e}));
 place();ready();
}
function xy(p,rel,i){
 if(rel<0){const o=Y0[p];return[o[1]+3+(i%2?1.3:-1.3)+.0,o[0]+3+(i>1?1.3:-1.3)]}
 const [r,c]=rel<=50?PATH[(START[p]+rel)%52]:rel<=55?HC[p][rel-51]:FIN[p];
 return[c+.5,r+.5];
}
function place(){
 const cnt={};
 g.P.forEach((p,k)=>g.t[k].forEach((rel,i)=>{
  const[x,y]=xy(p,rel,i),key=x+','+y,n=cnt[key]=(cnt[key]||0)+1,o=(n-1)*.2,e=g.el[k][i];
  e.style.left=((x+o)/15*100)+'%';e.style.top=((y-o)/15*100)+'%';
 }));
}
const canMove=(k,i,r)=>{const t=g.t[k][i];return t<0?r==6:t+r<=56};
function lRoll(r){
 g.roll=r;const k=g.turn,m=[0,1,2,3].filter(i=>canMove(k,i,r));
 if(!m.length){status(N[g.P[k]]+' rolled '+r+': no move',g.P[k]);return setTimeout(()=>lNext(false),900)}
 g.st='move';status(N[g.P[k]]+' rolled '+r+': tap a token',g.P[k]);
 if(m.length==1)return setTimeout(()=>lMove(m[0]),500);
 m.forEach(i=>g.el[k][i].classList.add('go'));
}
function lMove(i){
 const k=g.turn,p=g.P[k],r=g.roll;g.st='busy';
 g.el.flat().forEach(e=>e.classList.remove('go'));
 const n=g.t[k][i]<0?0:g.t[k][i]+r;g.t[k][i]=n;let extra=r==6;
 if(n<=50){const a=(START[p]+n)%52;
  if(!SAFE.includes(a))g.P.forEach((q,j)=>{if(j!=k)g.t[j].forEach((t,x)=>{if(t>=0&&t<=50&&(START[q]+t)%52==a){g.t[j][x]=-1;extra=true}})})}
 if(n==56)extra=true;
 place();
 if(g.t[k].every(t=>t==56)){g.st='done';status(N[p]+' wins!',p);return}
 setTimeout(()=>lNext(extra),450);
}
function lNext(extra){if(!g)return;if(!extra)g.turn=(g.turn+1)%g.P.length;ready()}

/* ---------- SNAKES & LADDERS ---------- */
const SN={16:6,47:26,49:11,56:53,62:19,64:60,87:24,93:73,95:75,98:78},LD={1:38,4:14,9:31,21:42,28:84,36:44,51:67,71:91,80:100};
const cell=n=>{const r=Math.floor((n-1)/10),c=r%2?9-(n-1)%10:(n-1)%10;return[c*10+5,(9-r)*10+5]};
function snl(){
 const P=players();g={k:'snl',P,pos:P.map(()=>1),turn:0,st:'roll'};
 const b=$('#board');b.className='sb';b.innerHTML='';
 for(let row=9;row>=0;row--)for(let col=0;col<10;col++){
  const n=row*10+(row%2?9-col:col)+1,d=document.createElement('i');d.textContent=n;
  d.style.background=(row+col)%2?'#fff3c4':'#e2f0ff';b.append(d)}
 let s='<svg viewBox="0 0 100 100">';
 for(const a in LD){const[x1,y1]=cell(+a),[x2,y2]=cell(LD[a]),L=Math.hypot(x2-x1,y2-y1),ox=(y2-y1)/L*1.3,oy=-(x2-x1)/L*1.3;
  s+=`<g stroke="#a0621c" stroke-linecap="round"><line x1="${x1+ox}" y1="${y1+oy}" x2="${x2+ox}" y2="${y2+oy}" stroke-width="1"/><line x1="${x1-ox}" y1="${y1-oy}" x2="${x2-ox}" y2="${y2-oy}" stroke-width="1"/><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="2.6" stroke-dasharray=".8 2.4"/></g>`}
 for(const a in SN){const[x1,y1]=cell(+a),[x2,y2]=cell(SN[a]),mx=(x1+x2)/2+(y2-y1)*.12,my=(y1+y2)/2-(x2-x1)*.12;
  s+=`<path d="M${x1} ${y1}Q${mx} ${my} ${x2} ${y2}" fill="none" stroke="#2fb83a" stroke-width="2.2" stroke-linecap="round" opacity=".85"/><circle cx="${x1}" cy="${y1}" r="2" fill="#1f8a2a"/><circle cx="${x1}" cy="${y1-.5}" r=".6" fill="#fff"/>`}
 b.insertAdjacentHTML('beforeend',s+'</svg>');
 g.el=P.map(p=>{const e=document.createElement('i');e.className='tok';e.style.background=C[p];b.append(e);return e});
 sPlace();ready();
}
function sPlace(){g.pos.forEach((n,k)=>{const[x,y]=cell(n),o=k*1.4-2;const e=g.el[k];e.style.left=(x+o)+'%';e.style.top=(y+o*.5)+'%'})}
function sRoll(r){
 const k=g.turn,p=g.P[k];let left=g.pos[k]+r>100?0:r;
 status(N[p]+' rolled '+r,p);
 const step=()=>{
  if(left>0){g.pos[k]++;left--;sPlace();return setTimeout(step,200)}
  const q=g.pos[k],to=SN[q]||LD[q];
  if(to){g.pos[k]=to;sPlace();status(N[p]+(SN[q]?' slid down!':' climbed up!'),p)}
  if(g.pos[k]==100){g.st='done';return status(N[p]+' wins!',p)}
  setTimeout(()=>{if(r!=6)g.turn=(g.turn+1)%g.P.length;ready()},to?700:250);
 };
 setTimeout(step,300);
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
